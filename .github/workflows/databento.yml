name: databento
on:
  push:
    paths: ['.github/workflows/databento.yml','databento/*.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: run step
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: |
          if [ -z "$DATABENTO_API_KEY" ]; then echo "NO SECRET" > databento/cost_report.txt; else
          pip install -q databento pandas pyarrow
          python databento/$(cat databento/STEP) 2>&1 | tail -80 > databento/log.txt || true; fi
      - name: commit
        run: |
          git config user.name "aurum-bot"; git config user.email "aurum-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do git pull --rebase origin ${GITHUB_REF_NAME} || true; git add -A databento; git commit -m "databento: results" || exit 0; git push origin HEAD:${GITHUB_REF_NAME} && exit 0; sleep 15; done
